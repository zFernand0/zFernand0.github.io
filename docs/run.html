    let completedState = {};
    let wishlistState = {};
    let currentCategory = 'all';
    let searchQuery = '';
    let showWishlistOnly = false;

    // Load from LocalStorage
    function loadState() {
      try {
        const savedCompleted = localStorage.getItem('marathon_completed_v1');
        const savedWishlist = localStorage.getItem('marathon_wishlist_v1');
        if (savedCompleted) completedState = JSON.parse(savedCompleted);
        if (savedWishlist) wishlistState = JSON.parse(savedWishlist);
      } catch (e) {
        console.error('Failed to load state from localStorage', e);
      }
    }

    // Save to LocalStorage
    function saveState() {
      try {
        localStorage.setItem('marathon_completed_v1', JSON.stringify(completedState));
        localStorage.setItem('marathon_wishlist_v1', JSON.stringify(wishlistState));
      } catch (e) {
        console.error('Failed to save state to localStorage', e);
      }
      updateStats();
    }

    function initTheme() {
      if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    }

    function toggleCompleted(id) {
      completedState[id] = !completedState[id];
      saveState();
      renderList();
    }

    function toggleWishlist(id, event) {
      event.stopPropagation();
      wishlistState[id] = !wishlistState[id];
      saveState();
      renderList();
    }

    function toggleDetails(id) {
      const el = document.getElementById(`details-${id}`);
      const icon = document.getElementById(`chevron-${id}`);
      if (el) {
        el.classList.toggle('hidden');
        if (icon) {
          icon.classList.toggle('rotate-180');
        }
      }
    }

    function updateStats() {
      const total = marathons.length;
      const completedCount = Object.keys(completedState).filter(k => completedState[k]).length;
      const percent = Math.round((completedCount / total) * 100);

      document.getElementById('progressStatsText').innerText = `${completedCount} of ${total} (${percent}%)`;
      document.getElementById('progressBar').style.width = `${percent}%`;

      // Category breakdown
      const majorsDone = marathons.filter(m => m.category === 'majors' && completedState[m.id]).length;
      const euroDone = marathons.filter(m => m.category === 'europe' && completedState[m.id]).length;
      const destDone = marathons.filter(m => m.category === 'destination' && completedState[m.id]).length;
      const wishlistDone = Object.keys(wishlistState).filter(k => wishlistState[k]).length;

      document.getElementById('majorsCount').innerText = `${majorsDone} / 7`;
      document.getElementById('euroCount').innerText = `${euroDone} / 6`;
      document.getElementById('destCount').innerText = `${destDone} / 7`;
      document.getElementById('wishlistCount').innerText = `${wishlistDone}`;
    }

    function resetData() {
      if (confirm("Are you sure you want to reset your saved marathon checklist and wishlist?")) {
        completedState = {};
        wishlistState = {};
        saveState();
        renderList();
      }
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-zinc-900', 'text-white', 'dark:bg-zinc-100', 'dark:text-zinc-900');
        btn.classList.add('text-zinc-600', 'hover:bg-zinc-100', 'dark:text-zinc-400', 'dark:hover:bg-zinc-800');
      });
      const activeBtn = document.getElementById(`tab-${cat}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-zinc-600', 'hover:bg-zinc-100', 'dark:text-zinc-400', 'dark:hover:bg-zinc-800');
        activeBtn.classList.add('bg-zinc-900', 'text-white', 'dark:bg-zinc-100', 'dark:text-zinc-900');
      }
      renderList();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      renderList();
    }

    function toggleWishlistOnly() {
      showWishlistOnly = !showWishlistOnly;
      const btn = document.getElementById('wishlistFilterBtn');
      if (showWishlistOnly) {
        btn.classList.add('bg-amber-500/10', 'border-amber-400', 'text-amber-500');
      } else {
        btn.classList.remove('bg-amber-500/10', 'border-amber-400', 'text-amber-500');
      }
      renderList();
    }

    function resetFilters() {
      searchQuery = '';
      currentCategory = 'all';
      showWishlistOnly = false;
      document.getElementById('searchInput').value = '';
      document.getElementById('wishlistFilterBtn').classList.remove('bg-amber-500/10', 'border-amber-400', 'text-amber-500');
      setCategory('all');
    }

    function renderList() {
      const listContainer = document.getElementById('marathonsList');
      const emptyState = document.getElementById('emptyState');

      const filtered = marathons.filter(m => {
        // Category filter
        if (currentCategory !== 'all' && m.category !== currentCategory) return false;
        
        // Wishlist filter
        if (showWishlistOnly && !wishlistState[m.id]) return false;

        // Search query
        if (searchQuery) {
          const matchName = m.name.toLowerCase().includes(searchQuery);
          const matchCountry = m.country.toLowerCase().includes(searchQuery);
          const matchDesc = m.famousFeature.toLowerCase().includes(searchQuery) || m.iconicHighlight.toLowerCase().includes(searchQuery);
          const matchProfile = m.courseProfile.toLowerCase().includes(searchQuery);
          return matchName || matchCountry || matchDesc || matchProfile;
        }

        return true;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      listContainer.innerHTML = filtered.map(m => {
        const isDone = !!completedState[m.id];
        const isWish = !!wishlistState[m.id];

        let badgeBg = "bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400";
        if (m.category === 'majors') badgeBg = "bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/20";
        if (m.category === 'europe') badgeBg = "bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20";
        if (m.category === 'destination') badgeBg = "bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20";

        return `
          <div class="group rounded-xl bg-white dark:bg-zinc-900 border ${isDone ? 'border-emerald-500/50 dark:border-emerald-500/40 bg-emerald-50/20 dark:bg-emerald-950/10' : 'border-zinc-200 dark:border-zinc-800'} transition duration-150 hover:border-zinc-300 dark:hover:border-zinc-700 shadow-sm overflow-hidden">
            
            <!-- Main Row -->
            <div class="p-4 sm:p-5 flex items-center justify-between gap-3 cursor-pointer" onclick="toggleDetails('${m.id}')">
              
              <div class="flex items-center space-x-3 sm:space-x-4 min-w-0">
                <!-- Custom Checkbox -->
                <button 
                  onclick="event.stopPropagation(); toggleCompleted('${m.id}')"
                  class="flex-shrink-0 w-6 h-6 sm:w-7 sm:h-7 rounded-lg border ${isDone ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-zinc-300 dark:border-zinc-700 hover:border-emerald-500 text-transparent'} transition flex items-center justify-center focus:outline-none"
                  aria-label="Mark completed"
                >
                  <i class="fa-solid fa-check text-xs sm:text-sm font-bold"></i>
                </button>

                <!-- Title & Basic Info -->
                <div class="min-w-0">
                  <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                    <h3 class="font-semibold text-base sm:text-lg text-zinc-900 dark:text-zinc-100 truncate ${isDone ? 'line-through text-zinc-400 dark:text-zinc-500' : ''}">
                      ${m.name}
                    </h3>
                    <span class="text-xs px-2 py-0.5 rounded-full font-medium ${badgeBg}">
                      ${m.categoryLabel}
                    </span>
                  </div>
                  <div class="flex items-center space-x-2 text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 mt-1">
                    <span>${m.flag} ${m.country}</span>
                    <span>•</span>
                    <span><i class="fa-regular fa-calendar text-xs mr-1"></i>${m.month}</span>
                    <span>•</span>
                    <span class="truncate hidden sm:inline"><i class="fa-solid fa-person-running text-xs mr-1"></i>${m.courseProfile}</span>
                  </div>
                </div>
              </div>

              <!-- Action Buttons & Chevron -->
              <div class="flex items-center space-x-2 flex-shrink-0">
                <!-- Wishlist Star -->
                <button 
                  onclick="toggleWishlist('${m.id}', event)"
                  class="p-2 rounded-lg text-zinc-400 hover:text-amber-400 transition"
                  title="Save to Wishlist"
                >
                  <i class="${isWish ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star text-base sm:text-lg"></i>
                </button>

                <!-- Chevron toggle -->
                <div class="p-1.5 text-zinc-400 group-hover:text-zinc-600 dark:group-hover:text-zinc-200 transition">
                  <i id="chevron-${m.id}" class="fa-solid fa-chevron-down text-sm transition-transform duration-200"></i>
                </div>
              </div>
            </div>

            <div id="details-${m.id}" class="hidden border-t border-zinc-100 dark:border-zinc-800/80 bg-zinc-50/50 dark:bg-zinc-900/50 p-4 sm:p-5 text-sm space-y-3">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="bg-white dark:bg-zinc-800/50 p-3 rounded-lg border border-zinc-200/50 dark:border-zinc-700/40">
                  <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400 block">Course Profile</span>
                  <span class="text-zinc-700 dark:text-zinc-200 font-medium mt-0.5 block">${m.courseProfile}</span>
                </div>
                <div class="bg-white dark:bg-zinc-800/50 p-3 rounded-lg border border-zinc-200/50 dark:border-zinc-700/40">
                  <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400 block">Field Size</span>
                  <span class="text-zinc-700 dark:text-zinc-200 font-medium mt-0.5 block">${m.fieldSize} runners</span>
                </div>
                <div class="bg-white dark:bg-zinc-800/50 p-3 rounded-lg border border-zinc-200/50 dark:border-zinc-700/40">
                  <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400 block">Race Window</span>
                  <span class="text-zinc-700 dark:text-zinc-200 font-medium mt-0.5 block">${m.month}</span>
                </div>
              </div>

              <div class="space-y-2 pt-1">
                <div>
                  <span class="font-semibold text-zinc-800 dark:text-zinc-200">Famous Feature:</span>
                  <p class="text-zinc-600 dark:text-zinc-400 mt-0.5 leading-relaxed">${m.famousFeature}</p>
                </div>
                <div>
                  <span class="font-semibold text-zinc-800 dark:text-zinc-200">Iconic Highlight:</span>
                  <p class="text-zinc-600 dark:text-zinc-400 mt-0.5 leading-relaxed">${m.iconicHighlight}</p>
                </div>
              </div>

              <div class="pt-2 flex justify-end">
                <a 
                  href="${m.link}" 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  class="inline-flex items-center space-x-1.5 text-xs font-medium text-emerald-600 dark:text-emerald-400 hover:underline"
                >
                  <span>Official Marathon Website</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </a>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    window.onload = function() {
      initTheme();
      loadState();
      updateStats();
      renderList();
    };
  </script>
</body>
</html>
